<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>
  <body>
    <!-- Navbar minimal a due "pill" ovali -->
    <nav class="navbar navbar-dark bg-primary px-0 py-0 fixed-top border-0" style="background: none; box-shadow: none; z-index: 1050;">
      <div class="d-flex flex-row justify-content-between align-items-center w-100" style="pointer-events: none;">
        <div class="bg-primary bg-opacity-75 rounded-pill px-3 py-1 ms-3 mt-3 shadow d-flex align-items-center" style="pointer-events: auto; min-width: unset; max-width: 340px;">
          <a class="logo navbar-brand fw-bold text-white mb-0" href="#" style="font-size: 1.1rem; white-space: nowrap;">Meteo Su Misura - Previsioni ad Alta Risoluzione</a>
        </div>
        <div class="bg-primary bg-opacity-75 rounded-pill px-2 py-1 me-3 mt-3 shadow d-flex align-items-center" style="pointer-events: auto; min-width: unset; max-width: 320px;">
          <ul class="navbar-nav flex-row gap-2 mb-0">
            <!-- <li class="nav-item"><a class="nav-link text-white px-2" href="#map">Mappa</a></li> -->
            <li class="nav-item"><a class="nav-link text-white px-2" download href="json/wrfoutput.grib2">Download</a></li>
            <li class="nav-item"><a class="nav-link text-white px-2" href="https://github.com/isislab-unisa/WRF4Salerno">About</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <div style="height:70px;"></div>

    <div class="info-panel">
      <span id="update-time">Dati non disponibili</span>
      <div class="dataset-info"></div>
    </div>
    <div class="info-box" id="data">
      Nessun dato disponibile
    </div>

    <div class="forecast-type-panel position-fixed end-0 mt-5 me-4 bg-white bg-opacity-75 rounded-3 shadow border border-primary px-4 py-3 d-flex flex-column gap-2 align-items-end" style="z-index: 40; top: 70px;">
      <div class="form-check form-check-inline mb-1">
        <input class="form-check-input" type="radio" name="forecastType" id="radioWind" value="wind" checked />
        <label class="form-check-label fw-semibold text-primary" for="radioWind">Wind</label>
      </div>
      <div class="form-check form-check-inline mb-1">
        <input class="form-check-input" type="radio" name="forecastType" id="radioTemp" value="temperature" />
        <label class="form-check-label fw-semibold text-danger" for="radioTemp">T</label>
      </div>
    </div>

    <div class="container-fluid p-0" style="height: 100vh;">
      <div id="map" style="height: 100%; min-height: 500px;"></div>
    </div>

    <div class="timeline-bar bg-light shadow-sm py-3 px-4 rounded-3 border border-primary" style="max-width: 600px; margin: 0 auto; position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 20;">
      <form class="row align-items-center g-2">
        <div class="col-auto">
          <label for="timeSlider" class="form-label fw-bold mb-0">Orario:</label>
        </div>
        <div class="col position-relative">
          <span id="selectedTime" class="badge bg-primary fs-6 position-absolute translate-middle-x" style="top: -32px; left: 50%; z-index: 2;">Orario selezionato: 1</span>
          <input
            type="range"
            class="form-range timeline-range w-100"
            id="timeSlider"
            min="0"
            max="23"
            value="0"
            step="1"
            style="width: 100%; flex: 1 1 0%; min-width: 0; max-width: 100%; display: block;"
          />
          <div class="timeline-ticks w-100 d-flex justify-content-between px-1 mt-1">
            <span>0</span>
            <span>3</span>
            <span>6</span>
            <span>9</span>
            <span>12</span>
            <span>15</span>
            <span>18</span>
            <span>21</span>
            <span>23</span>
          </div>
        </div>
      </form>
    </div>

    <!-- Nuova icona avatar download -->
    <a href="json/wrfoutput.grib2" download class="download-avatar" title="Scarica il file GRIB2">
      <i class="bi bi-cloud-arrow-down-fill"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"
    />
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <script src="js/modal.js"></script>
    <script src="js/files.js"></script>
    <script src="js/map.js"></script>
  </body>
</html>
