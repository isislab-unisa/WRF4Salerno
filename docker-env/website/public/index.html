<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meteo Su Misura : AREA SELEZIONATA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="Image/logo.png" />
  </head>
  <body>
    <!-- Navbar minimal a due "pill" ovali -->
    <nav class="navbar navbar-dark bg-primary px-0 py-0 fixed-top border-0" style="background: none; box-shadow: none; z-index: 1050;">
      <div class="d-flex flex-row justify-content-between align-items-center w-100" style="pointer-events: none;">
        <div class="navbar-logo-pill bg-white bg-opacity-75 rounded-pill px-4 py-2 ms-3 mt-3 shadow d-flex flex-column align-items-center" style="pointer-events: auto; min-width: unset; width: auto; max-width: 100%;">
          <img src="image/logo.png" alt="Logo" style="height:2.7em;max-width:90px;object-fit:contain;display:block;">
          <span class="logo-area fw-bold text-primary mt-1" style="font-size:1.1em;letter-spacing:0.01em;">Area</span>
        </div>
        <div class="bg-primary bg-opacity-75 rounded-pill px-2 py-1 me-3 mt-3 shadow d-flex align-items-center ms-auto justify-content-end" style="pointer-events: auto; min-width: unset; width: auto; max-width: 100%; text-align: end; padding-left: 10px; padding-right: 10px;">
          <ul class="navbar-nav flex-row gap-2 mb-0" style="text-align: end;">
            <li class="nav-item">
              <a class="nav-link text-white px-2" download href="json/wrfoutput.grib2" title="Download">
                <i class="bi bi-cloud-arrow-down-fill"></i>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white px-2" href="https://github.com/isislab-unisa/WRF4Salerno" title="About">
                <i class="bi bi-info-circle-fill"></i>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white px-2" href="#" id="toggleInfoPanel" title="Info">
                <i class="bi bi-list-ul"></i>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div style="height:70px;"></div>

    <div class="info-panel">
      <span id="update-time">Dati non disponibili</span>
      <div class="dataset-info"></div>
    </div>
    <div class="info-box" id="data">
      Nessun dato disponibile
    </div>

    <!-- Scala di intensità dinamica a sinistra -->
    <div id="legend-scale" class="legend-scale position-fixed start-0 top-50 translate-middle-y ms-2" style="z-index: 50;">
      <!-- Il contenuto verrà gestito da JS -->
    </div>

    <div class="forecast-type-panel-minimal position-fixed end-0 mt-5 me-4 rounded-3 shadow border border-primary d-flex flex-column gap-2 align-items-center" style="z-index: 40; top: 70px; min-width: 60px; background: rgba(255,255,255,0.35);">
      <input class="d-none" type="radio" name="forecastType" id="radioWind" value="wind" checked />
      <label for="radioWind" class="icon-label"><i class="bi bi-wind"></i></label>
      <input class="d-none" type="radio" name="forecastType" id="radioTemp" value="temperature" />
      <label for="radioTemp" class="icon-label"><i class="bi bi-thermometer-half"></i></label>
      <input class="d-none" type="radio" name="forecastType" id="radioRain" value="rain" />
      <label for="radioRain" class="icon-label"><i class="bi bi-cloud-rain-heavy"></i></label>
    </div>

    <div class="container-fluid p-0" style="height: 100vh;">
      <div id="map" style="height: 100%; min-height: 500px;"></div>
    </div>

    <div class="timeline-bar bg-light shadow-sm py-3 px-4 rounded-3 border border-primary d-flex align-items-center gap-3 w-100" style="width: 100vw; max-width: 100vw; left: 0; right: 0; margin: 0; position: fixed; bottom: 0; transform: none; z-index: 20; border-radius: 0;">
      <button id="timelinePlayBtn" type="button" class="btn btn-outline-primary d-flex align-items-center justify-content-center ms-2" style="width: 44px; height: 44px; border-radius: 50%;">
        <i id="timelinePlayIcon" class="bi bi-play-fill fs-3"></i>
      </button>
      <button id="toggleChartBtn" type="button" class="btn btn-outline-secondary d-flex align-items-center justify-content-center ms-2" style="width: 44px; height: 44px; border-radius: 50%;" title="Mostra/Nascondi grafico">
        <i id="toggleChartIcon" class="bi bi-bar-chart-line-fill fs-4"></i>
      </button>
      <form class="row align-items-center g-2 flex-grow-1 m-0 w-100">
        <div class="col position-relative">
          <span id="selectedTime" class="badge bg-primary fs-6 position-absolute translate-middle-x" style="top: -32px; left: 50%; z-index: 2;">1</span>
          <input
            type="range"
            class="form-range timeline-range w-100"
            id="timeSlider"
            min="0"
            max="23"
            value="0"
            step="1"
            style="width: 100%; flex: 1 1 0%; min-width: 0; max-width: 100%; display: block;"
          />
          <div id="timeSliderLabels" class="range-labels d-flex justify-content-between mt-1" style="font-size:0.85em;">
            <!-- Etichette generate da JS -->
          </div>
        </div>
      </form>
      
    </div>

    <!-- Nuova icona avatar download -->
    <!-- <a href="json/wrfoutput.grib2" download class="download-avatar" title="Scarica il file GRIB2">
      <i class="bi bi-cloud-arrow-down-fill"></i>
    </a> -->

    <div class="chart-container mt-3 mb-3">
      <div id="chartLoadingSpinner" style="display:none; text-align:center; margin:10px 0;">
        <div class="spinner-border text-primary" role="status" style="width:2rem; height:2rem;">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      
      <canvas id="infoChart" width="400" height="200"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"
    />
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <script src="js/modal.js"></script>
    <script src="js/files.js"></script>
    <script src="js/map.js"></script>
  </body>
</html>
